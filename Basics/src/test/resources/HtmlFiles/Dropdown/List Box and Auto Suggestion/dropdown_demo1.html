<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown & ListBox Demo</title>
</head>
<body>
<h2>Dropdown & ListBox Practice</h2>

<!-- 1. Single-Select DropDown -->
<label for="country-select">Choose Country:</label>
<select id="country-select">
    <option value="us">United States</option>
    <option value="in">India</option>
    <option value="uk">United Kingdom</option>
    <option value="ca">Canada</option>
</select>

<br><br><hr><br>

<!-- 2. Multi-Select ListBox -->
<label for="skills-select">Choose Skills (Multi-select):</label><br>
<select id="skills-select" multiple size="5">
    <option value="java_val">Java</option>
    <option value="python_val">Python</option>
    <option value="csharp_val">C#</option>
    <option value="js_val">JavaScript</option>
    <option value="sql_val">SQL</option>
</select>
</body>
</html>
