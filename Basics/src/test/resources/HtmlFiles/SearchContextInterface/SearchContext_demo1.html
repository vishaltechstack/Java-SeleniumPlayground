<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selenium SearchContext Practice Form</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
      padding: 32px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .field-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    /* Targetable via className: 'input-field' */
    .input-field {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--primary);
    }

    /* Targetable via className: 'btn-submit' */
    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .links-wrapper {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
    }

    .nav-link {
      color: var(--primary);
      text-decoration: none;
    }

    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="form-card">
    <h1 id="page-title">User Registration</h1>
    <p class="subtitle">SearchContext practice sandbox</p>

    <form id="registration-form" action="#">
      <!-- Targets for: id, name, className, tagName -->
      <div class="field-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="user_account"
          class="input-field"
          placeholder="Enter username"
        />
      </div>

      <div class="field-group">
        <label for="user-email">Email Address</label>
        <input
          type="email"
          id="user-email"
          name="email_address"
          class="input-field"
          placeholder="Enter email"
        />
      </div>

      <div class="field-group">
        <label for="user-role">Role</label>
        <!-- Target for: tagName, name, cssSelector -->
        <select id="user-role" name="role_selection" class="input-field">
          <option value="admin">Administrator</option>
          <option value="editor">Editor</option>
          <option value="viewer" selected>Viewer</option>
        </select>
      </div>

      <!-- Target for: className, tagName, cssSelector -->
      <button type="submit" id="submit-btn" class="btn-submit">
        Submit Form
      </button>

      <!-- Targets for: linkText, partialLinkText -->
      <div class="links-wrapper">
        <a href="#reset" class="nav-link">Forgot Password</a>
        <a href="#terms" class="nav-link">Read Terms of Service</a>
      </div>
    </form>
  </main>

</body>
</html>
