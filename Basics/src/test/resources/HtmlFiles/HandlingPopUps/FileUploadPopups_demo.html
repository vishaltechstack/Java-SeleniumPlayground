<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>6. File Upload Pop-up</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #f0f2f5; }
        .card { background: white; padding: 24px; border-radius: 8px; max-width: 450px; }
        .dropzone {
            border: 2px dashed #94a3b8;
            border-radius: 6px;
            padding: 30px;
            text-align: center;
            background: #f8fafc;
            margin-bottom: 12px;
            cursor: pointer;
        }
        input[type="file"] { display: block; margin-top: 10px; width: 100%; }
        .status { margin-top: 10px; font-size: 14px; color: #2563eb; }
    </style>
</head>
<body>

<div class="card">
    <h3>File Upload Practice</h3>
    <div class="dropzone">
        <p style="margin: 0; color: #475569;">Select a file from your machine:</p>
        <!-- Target this input element directly in Selenium via sendKeys() -->
        <input type="file" id="file-upload-input" onchange="handleFile(this)">
    </div>
    <div id="file-status" class="status"></div>
</div>

<script>
    function handleFile(input) {
        if (input.files && input.files[0]) {
            document.getElementById('file-status').innerText = 'Selected file: ' + input.files[0].name;
        }
    }
</script>

</body>
</html>
