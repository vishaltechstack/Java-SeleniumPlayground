<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>5. File Download Pop-up</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #f0f2f5; }
        .card { background: white; padding: 24px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .btn-download {
            display: inline-block;
            padding: 10px 18px;
            background: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h3>Download Sample Files</h3>
    <p style="font-size: 14px; color: #666;">Click to trigger direct client-side file downloads.</p>

    <!-- Method A: Native anchor download -->
    <button id="download-txt-btn" class="btn-download" onclick="generateAndDownloadFile('test_report.txt', 'Selenium Test Run: PASSED')">
        Download .TXT Report
    </button>
</div>

<script>
    function generateAndDownloadFile(filename, text) {
        const element = document.createElement('a');
        element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
        element.setAttribute('download', filename);
        element.id = 'temp-download-link';

        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
    }
</script>

</body>
</html>
