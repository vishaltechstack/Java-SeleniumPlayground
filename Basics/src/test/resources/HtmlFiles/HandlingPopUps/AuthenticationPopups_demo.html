<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3. Authentication Dialog Pop-up</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #eef2f7; }
        .auth-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000;
        }
        .auth-modal {
            background: white; width: 340px; padding: 24px; border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .auth-modal h3 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #555; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-login { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-cancel { width: 100%; padding: 8px; background: transparent; color: #666; border: none; margin-top: 6px; cursor: pointer; }
    </style>
</head>
<body>

<h2>Authentication Popup Practice</h2>
<button id="open-auth-btn" onclick="openAuth()">Sign In to Secure Area</button>
<p id="auth-status"></p>

<div id="auth-overlay" class="auth-overlay">
    <div class="auth-modal">
        <h3>Authentication Required</h3>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password">
        </div>
        <button id="submit-auth" class="btn-login" onclick="submitAuth()">Log In</button>
        <button class="btn-cancel" onclick="closeAuth()">Cancel</button>
    </div>
</div>

<script>
    function openAuth() { document.getElementById('auth-overlay').style.display = 'flex'; }
    function closeAuth() { document.getElementById('auth-overlay').style.display = 'none'; }
    function submitAuth() {
        const u = document.getElementById('username').value;
        document.getElementById('auth-status').innerText = 'Logged in as: ' + u;
        closeAuth();
    }
</script>

</body>
</html>
