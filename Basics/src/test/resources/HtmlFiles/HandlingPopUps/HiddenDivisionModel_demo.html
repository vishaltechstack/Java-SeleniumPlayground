<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>4. Hidden Division Modal</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #f8fafc; }

        /* Hidden division modal container */
        .modal-backdrop {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            width: 400px;
            position: relative;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .close-btn { font-size: 20px; cursor: pointer; border: none; background: none; color: #64748b; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
        .btn { padding: 8px 14px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-confirm { background: #3b82f6; color: white; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
    </style>
</head>
<body>

<h2>Hidden Division Modal Practice</h2>
<button id="open-modal-btn" onclick="toggleModal(true)">Open Terms Modal</button>

<div id="terms-modal" class="modal-backdrop">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0;">Terms of Agreement</h3>
            <button id="modal-close-x" class="close-btn" onclick="toggleModal(false)">×</button>
        </div>
        <p style="color: #475569; font-size: 14px; line-height: 1.5;">
            Please accept the updated automated user conditions before continuing your practice session.
        </p>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="toggleModal(false)">Decline</button>
            <button id="modal-accept-btn" class="btn btn-confirm" onclick="acceptTerms()">Accept</button>
        </div>
    </div>
</div>

<script>
    function toggleModal(show) {
        document.getElementById('terms-modal').style.display = show ? 'flex' : 'none';
    }
    function acceptTerms() {
        alert("Terms accepted!");
        toggleModal(false);
    }
</script>

</body>
</html>
