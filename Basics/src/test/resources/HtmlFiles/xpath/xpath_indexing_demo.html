<!DOCTYPE html>
<html lang="en">
<head>
    <title>XPath Indexing Demo</title>
</head>
<body>
    <div id="form-container">
        <!-- Multiple matching text inputs -->
        <input type="text" class="field" placeholder="First Name"><br><br>
        <input type="text" class="field" placeholder="Middle Name"><br><br>
        <input type="text" class="field" placeholder="Last Name"><br><br>
    </div>

    <!-- Table with identical cell structures -->
    <table id="products">
        <tr><td>Product A</td><td>$10</td></tr>
        <tr><td>Product B</td><td>$20</td></tr>
        <tr><td>Product C</td><td>$30</td></tr>
    </table>
</body>
</html>
