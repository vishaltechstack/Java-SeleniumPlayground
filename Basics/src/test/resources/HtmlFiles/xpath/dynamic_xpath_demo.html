<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XPath Functions Demo</title>
</head>
<body>
    <!-- 1. contains() target: Dynamic session ID appended to class/id -->
    <input type="text" id="user-input-sess_948271" placeholder="Enter username">

    <!-- 2. starts-with() target: Stable prefix followed by generated digits -->
    <button type="button" id="btn-submit-837492">Save Changes</button>

    <!-- 3. normalize-space() target: Multi-line text with irregular spacing -->
    <a href="https://example.com/download" id="download-link">

        Download   Latest
        Report

    </a>
</body>
</html>
