<!DOCTYPE html>
<html lang="en">
<head>
    <title>XPath by Attribute Demo</title>
</head>
<body>
<form>
    <!-- Attribute: name -->
    <input type="text" name="user_email" placeholder="Enter your email">

    <!-- Attribute: id -->
    <input type="password" id="user_pass" placeholder="Enter your password">

    <!-- Attribute: data-test (Custom HTML5 attribute) -->
    <button type="submit" data-test="login-button">Sign In</button>
</form>
</body>
</html>
