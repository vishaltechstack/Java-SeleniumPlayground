<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG Locators Demo</title>
    <style>
        .icon-btn {
            background: none;
            border: 1px solid #ccc;
            padding: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2>SVG Locators Practice</h2>

    <!-- Example 1: Search Button with nested SVG and Path -->
    <button class="icon-btn" id="search-btn" title="Search">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             viewBox="0 0 24 24"
             class="search-icon"
             data-testid="svg-search">
            <path d="M10 2a8 8 0 105.293 14.293l4.707 4.707 1.414-1.414-4.707-4.707A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"
                  fill="currentColor"
                  id="search-path"/>
        </svg>
    </button>

    <!-- Example 2: Standalone Chart/Graphic with nested Group (<g>) and Shapes (<circle>, <rect>) -->
    <div id="chart-container">
        <svg width="200" height="100" class="analytics-chart" aria-label="Analytics Chart">
            <g id="chart-elements">
                <circle id="node-1" cx="30" cy="50" r="20" fill="blue" stroke="black" />
                <rect id="bar-1" x="70" y="20" width="30" height="60" fill="green" />
            </g>
        </svg>
    </div>
</body>
</html>
