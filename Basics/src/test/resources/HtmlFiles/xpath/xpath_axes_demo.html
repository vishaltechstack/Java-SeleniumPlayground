<!DOCTYPE html>
<html lang="en">
<head>
    <title>XPath Axes Practice</title>
</head>
<body>

            <h2>User List</h2>
            <table border="1" id="users-table">

                <tr>
                    <th>User Name</th>
                    <th>Role</th>

                </thead>
                <tbody>
                <tr id="row-1">
                    <td class="name">Sarah Connor</td>
                    <td class="role">Admin</td>

                </tr>
                <tr id="row-2">
                    <td class="name">John Doe</td>
                    <td class="role">Editor</td>
                    <td><button class="btn-delete">Delete</button></td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
