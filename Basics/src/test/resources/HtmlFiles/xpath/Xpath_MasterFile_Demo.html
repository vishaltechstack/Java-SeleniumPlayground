<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XPath Master Class Demo</title>
</head>
<body>
    <div id="wrapper" class="container main-body">

        <!-- Standard Form Section -->
        <section id="login-section" data-section="auth">
            <h2 class="title">User Authentication</h2>

            <form id="auth-form" role="form">
                <!-- a) Attribute & d) Multiple Attributes -->
                <input type="text" name="user_name" class="input-field" placeholder="Enter Username" data-test="user-input" required>

                <!-- c) normalize-space() & starts-with() -->
                <button type="submit" class="btn btn-primary" id="btn-submit-12345">

                    Login Now

                </button>
            </form>
        </section>

        <!-- Dynamic Content & Axes Section -->
        <section id="table-section">
            <table id="users-table">
                <thead>
                <tr><th>User</th><th>Role</th><th>Action</th></tr>
                </thead>
                <tbody>
                <tr>
                    <!-- b) Text Function -->
                    <td class="username">Alex Mercer</td>
                    <td class="role">Admin</td>
                    <td><button class="action-btn">Edit</button></td>
                </tr>
                <tr>
                    <!-- Axes Targets -->
                    <td class="username">Sarah Connor</td>
                    <td class="role">Editor</td>
                    <td><button class="action-btn">Delete</button></td>
                </tr>
                </tbody>
            </table>
        </section>

        <!-- e) Surroundings & Shadow Context -->
        <div class="card-box">
            <label for="newsletter">Subscribe</label>
            <input type="checkbox" id="newsletter">
            <span class="helper-text">Stay updated</span>
        </div>

        <!-- Special XPath: SVG & Shadow Elements -->
        <div id="icon-container">
            <!-- Normal HTML vs SVG namespace -->
            <svg height="100" width="100" class="search-icon" data-icon="search">
                <circle cx="50" cy="50" r="40" stroke="green" stroke-width="4" fill="yellow" />
            </svg>
        </div>

    </div>
</body>
</html>
