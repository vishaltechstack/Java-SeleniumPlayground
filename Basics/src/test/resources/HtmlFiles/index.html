<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selenium Locators Practice</title>
</head>
<body>
    <h1>Locators Demo</h1>

    <!-- 1. id -->
    <input type="text" id="username" placeholder="Enter username"><br><br>

    <!-- 2. name -->
    <input type="password" name="userPassword" placeholder="Enter password"><br><br>

    <!-- 3. linkText & 4. partialLinkText -->
    <a href="https://www.google.com">Visit Official Website</a><br><br>

    <!-- 5. className -->
    <button class="btn-submit">Submit Form</button><br><br>

    <!-- 6. tagName -->
    <p>This is a demonstration paragraph.</p>

    <!-- 7. cssSelector -->
    <input type="email" id="email" class="form-input" data-test="user-email" placeholder="Enter email">
</body>
</html>
