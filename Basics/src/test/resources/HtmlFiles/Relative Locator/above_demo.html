<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Relative Locator - above() Demo</title>
</head>
<body>
    <form>
        <!-- The target element we want to find -->
        <input type="text" id="user-email" placeholder="Enter your email"><br><br>

        <!-- The reference element -->
        <input type="password" id="user-password" placeholder="Enter your password"><br><br>

        <button type="submit">Log In</button>
    </form>
</body>
</html>
