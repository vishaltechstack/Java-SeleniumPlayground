<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Below Locator Demo</title>
</head>
<body>
    <div style="width: 300px; margin: 50px auto;">
        <!-- Reference Element (Email Label) -->
        <label id="lbl-email" for="user-email">Email Address:</label>
        <br><br>

        <!-- Target Element directly BELOW the label -->
        <input type="email" id="user-email" placeholder="Enter your email">
    </div>
</body>
</html>
