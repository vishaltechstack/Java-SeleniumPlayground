<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selenium Relative Locator - near()</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .far-container { margin-top: 80px; }
    </style>
</head>
<body>

    <!-- Target 1: Checkbox within default 50px of text -->
    <div class="wrapper">
        <input type="checkbox" id="newsletter-optin">
        <span id="label-newsletter">Subscribe to weekly newsletter</span>
    </div>

    <!-- Target 2: Input box placed ~75px away for custom distance demo -->
    <div class="far-container">
        <span id="lbl-custom">Far Label</span>
        <div style="height: 60px;"></div>
        <input type="text" id="far-input" placeholder="Located > 50px away">
    </div>

</body>
</html>
