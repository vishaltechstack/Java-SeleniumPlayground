<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>toRightOf Demo</title>
    <style>
        .container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 40px;
            font-family: sans-serif;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Reference Element on the left -->
        <button id="btn-cancel">Cancel</button>

        <!-- Target Element directly to the right -->
        <button id="btn-submit" class="primary-btn">Submit</button>
    </div>
</body>
</html>
