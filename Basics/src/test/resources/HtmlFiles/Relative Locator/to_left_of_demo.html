<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Relative Locator - toLeftOf Demo</title>
    <style>
        .button-bar {
            display: flex;
            gap: 16px;
            margin: 40px;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h3>Action Toolbar</h3>
    <div class="button-bar">
        <!-- Target element to find (on the left) -->
        <button id="btn-back">Back</button>

        <!-- Reference element -->
        <button id="btn-next">Next</button>
    </div>
</body>
</html>
